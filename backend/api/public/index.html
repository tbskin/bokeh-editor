<!doctype html>
<html lang="en">
<head>
<meta charset="utf8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bokeh</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:#141210; --surface:#1c1916; --surface-2:#232019;
    --line:rgba(240,230,214,.10); --line-2:rgba(240,230,214,.17);
    --text:#ece6db; --muted:#9d9488; --faint:#6f675d;
    --accent:#e9a23b; --accent-ink:#1a1408;
    --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,"Cascadia Code",monospace;
    --serif:"Instrument Serif",Georgia,serif;
    --r:14px;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; }
  body {
    background:var(--bg); color:var(--text); font-family:var(--sans);
    -webkit-font-smoothing:antialiased; line-height:1.5;
    min-height:100vh; padding:48px 20px 80px;
  }
  .wrap { max-width:560px; margin:0 auto; }
  .brand { display:flex; align-items:baseline; gap:11px; }
  .brand h1 { font-family:var(--serif); font-weight:400; font-size:46px; line-height:1; margin:0; letter-spacing:.3px; }
  .brand .dot { width:8px; height:8px; border-radius:50%; background:var(--accent); align-self:flex-start; margin-top:8px; }
  .tag { font-family:var(--mono); font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); margin:6px 0 30px; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:22px 22px 24px; margin-bottom:18px; }
  .row + .row { margin-top:22px; }
  .step { display:block; font-family:var(--mono); font-size:11px; letter-spacing:.13em; text-transform:uppercase; color:var(--muted); margin:0 0 11px; }
  .step b { color:var(--accent); font-weight:400; margin-right:9px; }
  .pick { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .filebtn, .rec {
    font-family:var(--mono); font-size:12px; letter-spacing:.02em; color:var(--text);
    background:var(--surface-2); border:1px solid var(--line-2); border-radius:9px;
    padding:9px 14px; cursor:pointer; transition:border-color .15s, background .15s; display:inline-flex; align-items:center; gap:8px;
  }
  .filebtn:hover, .rec:hover { border-color:var(--accent); background:#26221a; }
  .filename { font-family:var(--mono); font-size:12px; color:var(--muted); }
  input[type=file] { display:none; }
  .rec .ind { width:8px; height:8px; border-radius:50%; background:var(--faint); }
  .rec.on { color:var(--accent); border-color:var(--accent); }
  .rec.on .ind { background:var(--accent); animation:pulse 1s infinite; }
  @keyframes pulse { 50% { opacity:.25; } }
  .go {
    width:100%; font-family:var(--mono); font-size:13px; letter-spacing:.1em; text-transform:uppercase; font-weight:600;
    background:var(--accent); color:var(--accent-ink); border:0; border-radius:10px; padding:14px; cursor:pointer;
    transition:filter .15s, transform .06s;
  }
  .go:hover { filter:brightness(1.07); }
  .go:active { transform:translateY(1px); }
  .go:disabled { background:var(--surface-2); color:var(--faint); cursor:default; }
  .status { font-family:var(--mono); font-size:12px; color:var(--muted); margin-top:14px; min-height:16px; display:flex; align-items:center; gap:8px; }
  .status .live { width:6px; height:6px; border-radius:50%; background:var(--accent); animation:pulse .9s infinite; }
  .status.err { color:#e06d4f; }
  .player { margin:18px 0; }
  .empty {
    display:flex; align-items:center; justify-content:center; height:200px;
    border:1px dashed var(--line-2); border-radius:var(--r);
    font-family:var(--mono); font-size:12px; color:var(--faint); letter-spacing:.04em;
  }
  video { width:100%; border-radius:var(--r); border:1px solid var(--line); background:#000; display:block; max-height:64vh; }
  .refine { display:flex; gap:10px; }
  .refine input {
    flex:1; background:var(--surface); border:1px solid var(--line-2); border-radius:10px; color:var(--text);
    font-family:var(--sans); font-size:14px; padding:12px 14px; outline:none; transition:border-color .15s;
  }
  .refine input:focus { border-color:var(--accent); }
  .refine input::placeholder { color:var(--faint); }
  .refine button {
    font-family:var(--mono); font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--text);
    background:var(--surface-2); border:1px solid var(--line-2); border-radius:10px; padding:0 18px; cursor:pointer;
  }
  .refine button:hover:not(:disabled) { border-color:var(--accent); }
  .refine button:disabled { color:var(--faint); cursor:default; }
  .wrap > * { animation:rise .5s both; }
  .tag { animation-delay:.04s; }
  .card { animation-delay:.09s; }
  .player, .refine { animation-delay:.14s; }
  @keyframes rise { from { opacity:0; transform:translateY(8px); } }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><h1>Bokeh</h1><span class="dot"></span></div>
    <p class="tag">local · voiceover montage</p>

    <div class="card">
      <div class="row">
        <span class="step"><b>01</b> clips</span>
        <div class="pick">
          <label class="filebtn" for="clips">choose clips</label>
          <input id="clips" type="file" accept="video/*" multiple />
          <span class="filename" id="clipsName">none selected</span>
        </div>
      </div>
      <div class="row">
        <span class="step"><b>02</b> voiceover</span>
        <div class="pick">
          <label class="filebtn" for="vo">upload audio</label>
          <input id="vo" type="file" accept="audio/*" />
          <button class="rec" id="rec"><span class="ind"></span>record</button>
          <span class="filename" id="voName">none</span>
        </div>
      </div>
      <div class="row">
        <span class="step"><b>03</b> make</span>
        <button class="go" id="go">Make montage</button>
        <div class="status" id="status"></div>
      </div>
    </div>

    <div class="player">
      <div class="empty" id="ph">your reel will appear here</div>
      <video id="reel" controls playsinline hidden></video>
    </div>

    <div class="refine">
      <input id="msg" placeholder="refine — e.g. tighten the intro, use the beach clip first" />
      <button id="refineBtn" disabled>Refine</button>
    </div>
  </div>

  <script type="module">
    let pid, recorder, chunks = [], voBlob, startedAt = 0;
    const fmtElapsed = () => {
      const s = Math.floor((Date.now() - startedAt) / 1000);
      return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
    };
    const $ = (id) => document.getElementById(id);
    const S = $("status"), reel = $("reel"), ph = $("ph"), go = $("go"), refineBtn = $("refineBtn");

    const setStatus = (text, { live = false, err = false } = {}) => {
      S.className = "status" + (err ? " err" : "");
      S.innerHTML = (live ? '<span class="live"></span>' : "") + text;
    };

    $("clips").onchange = (e) => {
      const n = e.target.files.length;
      $("clipsName").textContent = n ? `${n} clip${n > 1 ? "s" : ""} selected` : "none selected";
    };
    $("vo").onchange = (e) => {
      voBlob = null;
      $("voName").textContent = e.target.files[0] ? e.target.files[0].name : "none";
    };

    $("rec").onclick = async () => {
      const btn = $("rec");
      if (recorder?.state === "recording") { recorder.stop(); return; }
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      recorder = new MediaRecorder(stream);
      chunks = [];
      recorder.ondataavailable = (ev) => chunks.push(ev.data);
      recorder.onstop = () => {
        voBlob = new Blob(chunks, { type: "audio/wav" });
        stream.getTracks().forEach((t) => t.stop());
        btn.classList.remove("on"); btn.lastChild.textContent = "record";
        $("voName").textContent = "recorded";
      };
      recorder.start();
      btn.classList.add("on"); btn.lastChild.textContent = "stop";
    };

    async function poll() {
      const r = await (await fetch(`/api/projects/${pid}/status`)).json();
      if (r.state === "running") {
        setStatus(`${r.phase ?? "starting up"}… · ${fmtElapsed()}`, { live: true });
        setTimeout(poll, 2000);
      } else if (r.state === "done") {
        reel.src = r.reelUrl; reel.hidden = false; ph.style.display = "none";
        refineBtn.disabled = false; go.disabled = false;
        setStatus("ready ✓");
      } else if (r.state === "error") {
        go.disabled = false;
        setStatus(`error: ${r.error ?? "unknown"}`, { err: true });
      } else {
        setStatus("");
      }
    }

    go.onclick = async () => {
      if (!$("clips").files.length) { setStatus("add at least one clip", { err: true }); return; }
      if (!$("vo").files[0] && !voBlob) { setStatus("add a voiceover (upload or record)", { err: true }); return; }
      go.disabled = true; refineBtn.disabled = true; startedAt = Date.now();
      setStatus("uploading…", { live: true });
      pid = (await (await fetch("/api/projects", { method: "POST" })).json()).id;
      const fd = new FormData();
      for (const f of $("clips").files) fd.append("clips", f);
      const voFile = $("vo").files[0];
      if (voFile) fd.append("vo", voFile); else fd.append("vo", voBlob, "vo.wav");
      await fetch(`/api/projects/${pid}/assets`, { method: "POST", body: fd });
      await fetch(`/api/projects/${pid}/montage`, {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ brand: { niche: "general", tone: "clean", platform: "reels" } }),
      });
      poll();
    };

    refineBtn.onclick = async () => {
      const message = $("msg").value.trim();
      if (!message || !pid) return;
      refineBtn.disabled = true; go.disabled = true; startedAt = Date.now();
      setStatus("refining…", { live: true });
      await fetch(`/api/projects/${pid}/refine`, {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ message }),
      });
      $("msg").value = "";
      poll();
    };
    $("msg").addEventListener("keydown", (e) => { if (e.key === "Enter") refineBtn.click(); });
  </script>
</body>
</html>
